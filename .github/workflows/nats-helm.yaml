name: nats-helm

on:
  pull_request:
    paths:
    - 'helm/charts/nats/**'
    - .github/workflows/nats-helm.yaml

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:

    - name: Setup repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version: '1.26'
        check-latest: true
        cache: true
        cache-dependency-path: helm/charts/nats/test/go.sum

    - name: Test
      working-directory: helm/charts/nats/test
      run: go test
