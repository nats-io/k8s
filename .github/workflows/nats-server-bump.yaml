# Opens a pull request bumping the nats Helm chart to the newest stable
# nats-server release once the matching image tag is published on Docker Hub.
# The Docker Hub check is the gate: the official image only appears after the
# docker-library/official-images PR for that release has merged and built.
# Runs daily and is idempotent; it updates the same branch and PR until merged.
# The branch is regenerated from main on every run, so manual commits on it
# are overwritten. The repository deletes merged branches automatically.
# See .github/nats-server-bump.md for the GitHub App secrets this needs.
# Script usage and pin maintenance: README-nats_server_bump.md in this directory.
name: nats-server-bump

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nats-server-bump
  cancel-in-progress: false

env:
  CHART_DIR: helm/charts/nats
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  bump:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
          python-version: '3.14.9'
          download-from-astral-mirror: false
          enable-cache: false

      - name: Install pinned GitHub CLI
        env:
          GH_VERSION: '2.103.0'
          GH_SHA256: fdd768eb70f6409f80fcfa9f3a1c0adf0fc98d827ab3ce0bed2ac22762c5d786
        run: |-
          set -euo pipefail
          archive="$RUNNER_TEMP/gh.tar.gz"
          curl --fail --silent --show-error --location --max-time 120 \
            "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GH_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" "gh_${GH_VERSION}_linux_amd64/bin/gh"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Determine versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked .github/workflows/nats_server_bump.py check --chart-dir "$CHART_DIR"

      - name: Setup Go
        if: steps.versions.outputs.bump == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: true
          cache-dependency-path: helm/charts/nats/test/go.sum

      - name: Update chart files
        if: steps.versions.outputs.bump == 'true'
        env:
          CURRENT: ${{ steps.versions.outputs.current }}
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |-
          uv run --locked .github/workflows/nats_server_bump.py update \
            --chart-dir "$CHART_DIR" --current "$CURRENT" --latest "$LATEST"

      - name: Update Go dependency and test chart
        if: steps.versions.outputs.bump == 'true'
        working-directory: helm/charts/nats/test
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
        run: |-
          set -euo pipefail
          go get "github.com/nats-io/nats-server/v2@v${LATEST}"
          go mod tidy
          go test
          git --no-pager diff --stat

      - name: Create GitHub App token
        if: steps.versions.outputs.bump == 'true'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.NATS_BUMP_APP_ID }}
          private-key: ${{ secrets.NATS_BUMP_APP_PRIVATE_KEY }}

      - name: Create pull request
        if: steps.versions.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: bump/nats-server
          signoff: true
          commit-message: Bump nats to v${{ steps.versions.outputs.latest }}
          title: Bump nats to v${{ steps.versions.outputs.latest }}
          body: |-
            Bumps the nats chart from ${{ steps.versions.outputs.current }} to ${{ steps.versions.outputs.latest }}.

            - Release notes: https://github.com/nats-io/nats-server/releases/tag/v${{ steps.versions.outputs.latest }}
            - Image: https://hub.docker.com/_/nats/tags?name=${{ steps.versions.outputs.image_tag }}

            Generated by the `nats-server-bump` workflow.
